<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestor Gold</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ENCABEZADO SUPERIOR -->
  <header class="app-header">
    <div class="header-title">
      <span class="gold-dot"></span>
      <h1 id="page-title">Pedidos</h1>
    </div>
    <button id="btn-test-notif" class="btn-icon-gold" title="Probar Notificación">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="app-content">

    <!-- ========================================== -->
    <!-- SECCIÓN 1: PEDIDOS Y RECORDATORIOS         -->
    <!-- ========================================== -->
    <section id="tab-pedidos" class="tab-section active">
      <div class="card">
        <h2 class="card-title">Nuevo Pedido</h2>
        <form id="form-pedido">
          <div class="form-group">
            <label>Cliente</label>
            <input type="text" id="ped-cliente" placeholder="Nombre del cliente" required />
          </div>
          <div class="form-group">
            <label>Producto / Descripción</label>
            <input type="text" id="ped-desc" placeholder="Ej. Tenis Nike talla 27, Blusa negra..." required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Fecha del Pedido</label>
              <input type="date" id="ped-fecha-inicio" required />
            </div>
            <div class="form-group">
              <label>Fecha de Entrega</label>
              <input type="date" id="ped-fecha-entrega" required />
            </div>
          </div>
          <button type="submit" class="btn-gold">Guardar Pedido y Activar Alerta</button>
        </form>
      </div>

      <div class="section-subtitle">Pedidos Activos</div>
      <div id="lista-pedidos" class="list-container"></div>
    </section>

    <!-- ========================================== -->
    <!-- SECCIÓN 2: PAGOS Y PARCIALIDADES (2/4/8)   -->
    <!-- ========================================== -->
    <section id="tab-pagos" class="tab-section">
      <div class="card">
        <h2 class="card-title">Registrar Cuenta</h2>
        <form id="form-pago">
          <div class="form-group">
            <label>Cliente</label>
            <input type="text" id="pago-cliente" placeholder="Nombre del cliente" required />
          </div>
          <div class="form-group">
            <label>Monto Total ($)</label>
            <input type="number" id="pago-total" placeholder="Ej. 500" min="1" step="0.01" required />
          </div>

          <!-- DIVISOR DE PAGOS AUTOMÁTICO -->
          <div class="split-box">
            <label>Dividir cuenta en parcialidades:</label>
            <div class="split-buttons">
              <button type="button" class="split-btn active" data-parts="1">1 Pago</button>
              <button type="button" class="split-btn" data-parts="2">2 Pagos</button>
              <button type="button" class="split-btn" data-parts="4">4 Pagos</button>
              <button type="button" class="split-btn" data-parts="8">8 Pagos</button>
            </div>
            <div id="split-preview" class="split-preview">
              Ingresa un monto para calcular parcialidades
            </div>
          </div>

          <div class="form-group">
            <label>Abono Inicial (Opcional $)</label>
            <input type="number" id="pago-inicial" placeholder="0.00" min="0" step="0.01" />
          </div>

          <button type="submit" class="btn-gold">Crear Cuenta de Pago</button>
        </form>
      </div>

      <div class="section-subtitle">Control de Saldos</div>
      <div id="lista-pagos" class="list-container"></div>
    </section>

    <!-- ========================================== -->
    <!-- SECCIÓN 3: CATÁLOGOS PDF Y WHATSAPP        -->
    <!-- ========================================== -->
    <section id="tab-catalogos" class="tab-section">
      <div class="card">
        <h2 class="card-title">Categorías</h2>
        <div class="category-creator">
          <input type="text" id="nueva-categoria" placeholder="Nueva categoría (Ej. Ropa, Zapatos...)" />
          <button type="button" id="btn-crear-cat" class="btn-gold-outline">Crear</button>
        </div>
        <div id="chips-categorias" class="chips-container"></div>
      </div>

      <div class="card">
        <h2 class="card-title">Subir Catálogo PDF</h2>
        <form id="form-catalogo">
          <div class="form-group">
            <label>Nombre del Catálogo</label>
            <input type="text" id="cat-nombre" placeholder="Ej. Catálogo Invierno 2026" required />
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="cat-select" required></select>
          </div>
          <div class="form-group">
            <label>Archivo PDF</label>
            <input type="file" id="cat-archivo" accept="application/pdf" required class="file-input" />
          </div>
          <button type="submit" class="btn-gold">Guardar PDF</button>
        </form>
      </div>

      <div class="section-subtitle">Mis Catálogos</div>
      <div id="lista-catalogos" class="list-container"></div>
    </section>

  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="tab-pedidos" data-title="Pedidos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span>Pedidos</span>
    </button>

    <button class="nav-item" data-target="tab-pagos" data-title="Pagos y Abonos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Pagos</span>
    </button>

    <button class="nav-item" data-target="tab-catalogos" data-title="Catálogos PDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
      <span>Catálogos</span>
    </button>
  </nav>

  <!-- MODAL PARA ABONAR -->
  <div id="modal-abono" class="modal hidden">
    <div class="modal-content">
      <h3>Registrar Abono</h3>
      <p id="modal-abono-cliente" class="gold-text"></p>
      <p id="modal-abono-info" class="sub-text"></p>
      <div class="form-group">
        <label>Monto del Abono ($)</label>
        <input type="number" id="input-nuevo-abono" step="0.01" min="0.01" />
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-cancelar-abono" class="btn-dark">Cancelar</button>
        <button type="button" id="btn-confirmar-abono" class="btn-gold">Guardar Abono</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
